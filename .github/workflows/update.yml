name: Automated EPG Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytz
      - name: Download Source Playlist
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
        run: curl -s "$IPTV_URL" -o 2ndStrong8k.m3u
      - name: Run IPTV Script
        run: python iptv_builder.py --force
      - name: Commit and Push Clean Files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add clean_playlist.m3u clean_epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG and filtered playlist" && git push)
